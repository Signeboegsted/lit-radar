name: Monthly literature digest

on:
  schedule:
    # Runs at 06:00 UTC on the 1st of every month.
    # Edit the cron expression to change timing: https://crontab.guru
    - cron: '0 6 1 * *'
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab, for testing

jobs:
  send-digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Run search and send emails
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
        run: npm run notify
